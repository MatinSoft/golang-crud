basePath: /
definitions:
  application.CreateCustomerCommand:
    properties:
      bankAccountNumber:
        type: string
      dateOfBirth:
        description: YYYY-MM-DD
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      phoneNumber:
        type: string
    type: object
  domain.Customer:
    properties:
      bankAccountNumber:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      phoneNumber:
        type: string
      version:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Customer CRUD API built with Gin, DDD, Clean Architecture and CQRS.
  title: Customer CRUD API
  version: "1.0"
paths:
  /api/v1/customers:
    get:
      description: Get all customers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Customer'
            type: array
      summary: List all customers
      tags:
      - customers
    post:
      consumes:
      - application/json
      description: Create a new customer with validated mobile phone, email, and bank
        account number
      parameters:
      - description: Customer info
        in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/application.CreateCustomerCommand'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new customer
      tags:
      - customers
  /api/v1/customers/{id}:
    delete:
      description: Delete customer by ID
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete customer
      tags:
      - customers
    get:
      description: Get customer details by ID
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Customer'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get customer by ID
      tags:
      - customers
swagger: "2.0"
